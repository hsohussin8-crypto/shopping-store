name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android Assets
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/
          cp login.html app/src/main/assets/
          cp styles.css app/src/main/assets/
          cp app.js app/src/main/assets/

          cp admin.html app/src/main/assets/
          cp admin.css app/src/main/assets/
          cp admin.js app/src/main/assets/

          if [ -f manifest.json ]; then
            cp manifest.json app/src/main/assets/
          fi

          echo "=============================="
          echo "Assets:"
          ls -la app/src/main/assets/
          echo "=============================="

      - name: Build Debug APK
        run: |
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metjari-apk
          path: app/build/outputs/apk/debug/app-debug.apk