name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android Assets
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Checking required files..."
          echo "=============================="

          required_files=(
            "index.html"
            "login.html"
            "styles.css"
            "app.js"
            "admin.html"
            "admin.css"
            "admin.js"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "=============================="
          echo "Creating Android assets..."
          echo "=============================="

          mkdir -p app/src/main/assets

          rm -rf app/src/main/assets/*

          cp index.html app/src/main/assets/
          cp login.html app/src/main/assets/
          cp styles.css app/src/main/assets/
          cp app.js app/src/main/assets/

          cp admin.html app/src/main/assets/
          cp admin.css app/src/main/assets/
          cp admin.js app/src/main/assets/

          if [ -f manifest.json ]; then
            cp manifest.json app/src/main/assets/
            echo "OK: manifest.json"
          fi

          echo "=============================="
          echo "Android Assets:"
          echo "=============================="

          ls -lah app/src/main/assets/

          echo "=============================="

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo "Gradle Version"
          echo "=============================="

          gradle --version

          echo "=============================="
          echo "Building APK..."
          echo "=============================="

          gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metjari-apk
          path: app/build/outputs/apk/debug/app-debug.apk