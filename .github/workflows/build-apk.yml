name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # تحميل المشروع
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # إعداد Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # تجهيز ملفات التطبيق
      # ==========================================
      - name: Prepare Android Assets
        run: |
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/
          cp login.html app/src/main/assets/
          cp styles.css app/src/main/assets/
          cp app.js app/src/main/assets/

          # ملفات لوحة الإدارة
          cp admin.html app/src/main/assets/
          cp admin.css app/src/main/assets/
          cp admin.js app/src/main/assets/

          # manifest إذا كان موجوداً
          if [ -f manifest.json ]; then
            cp manifest.json app/src/main/assets/
          fi

          echo "================================"
          echo "Assets:"
          ls -la app/src/main/assets/
          echo "================================"

      # ==========================================
      # بناء APK
      # ==========================================
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ==========================================
      # رفع APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metjari-apk
          path: app/build/outputs/apk/debug/app-debug.apk