<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الإدارة - سوقي</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- شاشة تسجيل الدخول -->
  <section id="loginSection" class="login-section">
    <div class="login-box">
      <div class="login-logo">🛒</div>

      <h1>لوحة إدارة سوقي</h1>
      <p>تسجيل دخول المدير</p>

      <input
        type="email"
        id="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
      >

      <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
      >

      <button onclick="login()">دخول</button>

      <p id="loginMessage" class="message"></p>

      <a href="index.html">← العودة إلى المتجر</a>
    </div>
  </section>


  <!-- لوحة الإدارة -->
  <section id="adminSection" class="admin-section hidden">

    <header class="admin-header">
      <div>
        <h1>🛒 لوحة الإدارة</h1>
        <span id="adminEmail"></span>
      </div>

      <button class="logout-btn" onclick="logout()">
        تسجيل الخروج
      </button>
    </header>


    <main class="admin-container">

      <!-- الإحصائيات -->
      <div class="stats">

        <div class="stat-card">
          <span>📦</span>
          <strong id="productsCount">0</strong>
          <small>المنتجات</small>
        </div>

        <div class="stat-card">
          <span>🗂️</span>
          <strong id="categoriesCount">0</strong>
          <small>الأقسام</small>
        </div>

        <div class="stat-card">
          <span>🧾</span>
          <strong id="ordersCount">0</strong>
          <small>الطلبات</small>
        </div>

      </div>


      <!-- المنتجات -->
      <section class="panel">

        <div class="panel-title">
          <h2>📦 المنتجات</h2>

          <button onclick="openProductForm()">
            ➕ إضافة منتج
          </button>
        </div>

        <div id="productForm" class="form-box hidden">

          <h3 id="productFormTitle">إضافة منتج</h3>

          <input type="hidden" id="productId">

          <label>اسم المنتج</label>
          <input id="productName" type="text" placeholder="مثال: ساعة كلاسيكية">

          <label>السعر</label>
          <input id="productPrice" type="number" placeholder="85000">

          <label>المخزون</label>
          <input id="productStock" type="number" placeholder="10">

          <label>القسم</label>
          <select id="productCategory"></select>

          <label>رابط صورة المنتج</label>
          <input
            id="productImage"
            type="url"
            placeholder="https://example.com/image.jpg"
          >

          <label>الوصف</label>
          <textarea
            id="productDescription"
            placeholder="وصف المنتج..."
          ></textarea>

          <div class="form-buttons">
            <button onclick="saveProduct()">💾 حفظ</button>
            <button class="cancel-btn" onclick="closeProductForm()">
              إلغاء
            </button>
          </div>

        </div>

        <div id="productsList" class="items-list">
          جاري تحميل المنتجات...
        </div>

      </section>


      <!-- الأقسام -->
      <section class="panel">

        <div class="panel-title">
          <h2>🗂️ الأقسام</h2>

          <button onclick="addCategory()">
            ➕ إضافة قسم
          </button>
        </div>

        <div id="categoriesList" class="items-list">
          جاري تحميل الأقسام...
        </div>

      </section>


      <!-- الطلبات -->
      <section class="panel">

        <div class="panel-title">
          <h2>🧾 الطلبات</h2>

          <button onclick="loadOrders()">
            🔄 تحديث
          </button>
        </div>

        <div id="ordersList" class="items-list">
          جاري تحميل الطلبات...
        </div>

      </section>

    </main>

  </section>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="admin.js"></script>

</body>
</html>
